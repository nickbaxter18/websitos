name: Backend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [black, mypy, pytest, flake8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-json-report flake8 mypy black

      - name: Run Pytest
        if: ${{ matrix.task == 'pytest' }}
        continue-on-error: true
        run: |
          (pytest --maxfail=1 --disable-warnings -q --json-report --json-report-file=pytest-output.json 2>&1 | tee pytest-output.txt) || true
          echo $? > exit-code.txt
          node Scripts/convert-pytest.cjs pytest-output.txt pytest-report.json exit-code.txt || echo '{"workflow":"backend-checks","job":"pytest","status":"failure","errors":[{"message":"Pytest converter failed"}],"warnings":[],"notices":[]}' > pytest-report.json
          mkdir -p summaries
          mv pytest-report.json summaries/
          mv pytest-output.txt summaries/backend-pytest-raw.log || true
          mv exit-code.txt summaries/backend-pytest-exit-code.txt || true
          sha256sum summaries/* > summaries/checksums.txt || true

      - name: Run Mypy
        if: ${{ matrix.task == 'mypy' }}
        continue-on-error: true
        run: |
          (mypy . > mypy-output.txt 2>&1) || true
          echo $? > exit-code.txt
          node Scripts/convert-mypy.cjs mypy-output.txt mypy-report.json exit-code.txt || echo '{"workflow":"backend-checks","job":"mypy","status":"failure","errors":[{"message":"Mypy converter failed"}],"warnings":[],"notices":[]}' > mypy-report.json
          mkdir -p summaries
          mv mypy-report.json summaries/
          mv mypy-output.txt summaries/backend-mypy-raw.log || true
          mv exit-code.txt summaries/backend-mypy-exit-code.txt || true
          sha256sum summaries/* > summaries/checksums.txt || true

      - name: Run Flake8
        if: ${{ matrix.task == 'flake8' }}
        continue-on-error: true
        run: |
          (flake8 . > flake8-output.txt 2>&1) || true
          echo $? > exit-code.txt
          node Scripts/convert-flake8.cjs flake8-output.txt flake8-report.json exit-code.txt || echo '{"workflow":"backend-checks","job":"flake8","status":"failure","errors":[{"message":"Flake8 converter failed"}],"warnings":[],"notices":[]}' > flake8-report.json
          mkdir -p summaries
          mv flake8-report.json summaries/
          mv flake8-output.txt summaries/backend-flake8-raw.log || true
          mv exit-code.txt summaries/backend-flake8-exit-code.txt || true
          sha256sum summaries/* > summaries/checksums.txt || true

      - name: Run Black
        if: ${{ matrix.task == 'black' }}
        continue-on-error: true
        run: |
          (black --check . > black-output.txt 2>&1) || true
          echo $? > exit-code.txt
          node Scripts/convert-black.cjs black-output.txt black-report.json exit-code.txt || echo '{"workflow":"backend-checks","job":"black","status":"failure","errors":[{"message":"Black converter failed"}],"warnings":[],"notices":[]}' > black-report.json
          mkdir -p summaries
          mv black-report.json summaries/
          mv black-output.txt summaries/backend-black-raw.log || true
          mv exit-code.txt summaries/backend-black-exit-code.txt || true
          sha256sum summaries/* > summaries/checksums.txt || true

      - name: Generate Artifact Manifest
        run: |
          echo "📦 Artifact manifest for backend-${{ matrix.task }}" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt

      - name: Upload partial summaries (per job)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

  package-and-upload:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all backend job artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded

      - name: Collect backend summaries
        run: |
          mkdir -p summaries
          echo "📥 Checking downloaded artifacts:" > summaries/artifact-manifest.txt
          find downloaded -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
          find downloaded -name "*-report.json" -exec cp {} summaries/ \;
          echo "📂 Collected backend summaries with checksums:" >> summaries/artifact-manifest.txt
          sha256sum summaries/* >> summaries/artifact-manifest.txt || true

      - name: Upload combined backend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-summaries
          path: summaries/
          retention-days: 2