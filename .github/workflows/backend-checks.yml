name: Backend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [black, mypy, pytest, flake8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-json-report flake8 mypy black

      - name: Collect environment metadata
        id: envinfo
        run: |
          echo "lockfile_sha=$(sha256sum requirements.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "cpu_count=$(nproc)" >> $GITHUB_OUTPUT
          echo "memory_mb=$(free -m | awk '/Mem:/ {print $2}')" >> $GITHUB_OUTPUT
          echo "disk_free_mb=$(df -m . | awk 'NR==2 {print $4}')" >> $GITHUB_OUTPUT

      - name: Run Pytest
        if: ${{ matrix.task == 'pytest' }}
        run: |
          mkdir -p summaries
          start=$(date +%s)
          pytest --maxfail=1 --disable-warnings -q --json-report --json-report-file=pytest-output.json || true
          pytest_exit=$?
          end=$(date +%s)
          duration="$((end-start))s"

          sha256=$(sha256sum pytest-output.json | awk '{print $1}' || echo "")
          deps=$(pip freeze | jq -R -s -c 'split("\n") | map(select(length > 0))' || echo '[]')
          echo "$deps" | jq . >/dev/null 2>&1 || deps="[]"

          errors=$(jq '.summary.failed' pytest-output.json 2>/dev/null || echo 0)
          warnings=$(jq '.summary.warnings' pytest-output.json 2>/dev/null || echo 0)

          cat <<EOF > summaries/backend-pytest-diagnostics.json
          {
            "job": "backend-checks/pytest",
            "exit_code": $pytest_exit,
            "status": "$( [ "$pytest_exit" -eq 0 ] && echo success || echo failure )",
            "errors": $errors,
            "warnings": $warnings,
            "messages": $(jq '.tests | map({name: .nodeid, status: .outcome, message: .call.longreprtext})' pytest-output.json 2>/dev/null || echo []),
            "annotations": [],
            "tests": $(jq '.tests | map({name: .nodeid, status: .outcome, message: .call.longreprtext, duration: .duration})' pytest-output.json 2>/dev/null || echo []),
            "coverage": {},
            "artifacts": ["summaries/pytest-output.json"],
            "metadata": {
              "tool": "pytest",
              "version": "$(pip show pytest | grep Version | awk '{print $2}')",
              "duration": "$duration",
              "sha256": "$sha256",
              "fallback": false
            },
            "environment": {
              "runner": "${{ runner.name }}",
              "os": "${{ runner.os }}",
              "resources": {
                "cpu_count": ${{ steps.envinfo.outputs.cpu_count }},
                "memory_mb": ${{ steps.envinfo.outputs.memory_mb }},
                "disk_free_mb": ${{ steps.envinfo.outputs.disk_free_mb }}
              }
            },
            "dependencies": {
              "lockfile_sha": "${{ steps.envinfo.outputs.lockfile_sha }}",
              "pip": $deps
            }
          }
          EOF

      - name: Run Mypy
        if: ${{ matrix.task == 'mypy' }}
        run: |
          mkdir -p summaries
          start=$(date +%s)
          mypy . --show-column-numbers --show-error-codes --no-pretty > mypy-output.txt 2>&1 || true
          mypy_exit=$?
          end=$(date +%s)
          duration="$((end-start))s"

          sha256=$(sha256sum mypy-output.txt | awk '{print $1}' || echo "")
          deps=$(pip freeze | jq -R -s -c 'split("\n") | map(select(length > 0))' || echo '[]')
          echo "$deps" | jq . >/dev/null 2>&1 || deps="[]"

          errors=$(grep -c "error:" mypy-output.txt || echo 0)
          warnings=$(grep -c "note:" mypy-output.txt || echo 0)

          cat <<EOF > summaries/backend-mypy-diagnostics.json
          {
            "job": "backend-checks/mypy",
            "exit_code": $mypy_exit,
            "status": "$( [ "$mypy_exit" -eq 0 ] && echo success || echo failure )",
            "errors": $errors,
            "warnings": $warnings,
            "messages": [],
            "annotations": [],
            "tests": [],
            "coverage": {},
            "artifacts": ["summaries/mypy-output.txt"],
            "metadata": {
              "tool": "mypy",
              "version": "$(pip show mypy | grep Version | awk '{print $2}')",
              "duration": "$duration",
              "sha256": "$sha256",
              "fallback": false
            },
            "environment": {
              "runner": "${{ runner.name }}",
              "os": "${{ runner.os }}",
              "resources": {
                "cpu_count": ${{ steps.envinfo.outputs.cpu_count }},
                "memory_mb": ${{ steps.envinfo.outputs.memory_mb }},
                "disk_free_mb": ${{ steps.envinfo.outputs.disk_free_mb }}
              }
            },
            "dependencies": {
              "lockfile_sha": "${{ steps.envinfo.outputs.lockfile_sha }}",
              "pip": $deps
            }
          }
          EOF

      - name: Run Flake8
        if: ${{ matrix.task == 'flake8' }}
        run: |
          mkdir -p summaries
          start=$(date +%s)
          flake8 --format=json --output-file=flake8-output.json || true
          flake8_exit=$?
          end=$(date +%s)
          duration="$((end-start))s"

          sha256=$(sha256sum flake8-output.json | awk '{print $1}' || echo "")
          deps=$(pip freeze | jq -R -s -c 'split("\n") | map(select(length > 0))' || echo '[]')
          echo "$deps" | jq . >/dev/null 2>&1 || deps="[]"

          errors=$(jq 'map(. | length) | add' flake8-output.json 2>/dev/null || echo 0)
          warnings=0

          cat <<EOF > summaries/backend-flake8-diagnostics.json
          {
            "job": "backend-checks/flake8",
            "exit_code": $flake8_exit,
            "status": "$( [ "$flake8_exit" -eq 0 ] && echo success || echo failure )",
            "errors": $errors,
            "warnings": $warnings,
            "messages": $(jq 'to_entries | map({file: .key, messages: .value})' flake8-output.json 2>/dev/null || echo []),
            "annotations": [],
            "tests": [],
            "coverage": {},
            "artifacts": ["summaries/flake8-output.json"],
            "metadata": {
              "tool": "flake8",
              "version": "$(pip show flake8 | grep Version | awk '{print $2}')",
              "duration": "$duration",
              "sha256": "$sha256",
              "fallback": false
            },
            "environment": {
              "runner": "${{ runner.name }}",
              "os": "${{ runner.os }}",
              "resources": {
                "cpu_count": ${{ steps.envinfo.outputs.cpu_count }},
                "memory_mb": ${{ steps.envinfo.outputs.memory_mb }},
                "disk_free_mb": ${{ steps.envinfo.outputs.disk_free_mb }}
              }
            },
            "dependencies": {
              "lockfile_sha": "${{ steps.envinfo.outputs.lockfile_sha }}",
              "pip": $deps
            }
          }
          EOF

      - name: Run Black
        if: ${{ matrix.task == 'black' }}
        run: |
          mkdir -p summaries
          start=$(date +%s)
          black --check . > black-output.txt 2>&1 || true
          black_exit=$?
          end=$(date +%s)
          duration="$((end-start))s"

          sha256=$(sha256sum black-output.txt | awk '{print $1}' || echo "")
          deps=$(pip freeze | jq -R -s -c 'split("\n") | map(select(length > 0))' || echo '[]')
          echo "$deps" | jq . >/dev/null 2>&1 || deps="[]"

          errors=$(grep -c "would reformat" black-output.txt || echo 0)
          warnings=0

          cat <<EOF > summaries/backend-black-diagnostics.json
          {
            "job": "backend-checks/black",
            "exit_code": $black_exit,
            "status": "$( [ "$black_exit" -eq 0 ] && echo success || echo failure )",
            "errors": $errors,
            "warnings": $warnings,
            "messages": [],
            "annotations": [],
            "tests": [],
            "coverage": {},
            "artifacts": ["summaries/black-output.txt"],
            "metadata": {
              "tool": "black",
              "version": "$(pip show black | grep Version | awk '{print $2}')",
              "duration": "$duration",
              "sha256": "$sha256",
              "fallback": false
            },
            "environment": {
              "runner": "${{ runner.name }}",
              "os": "${{ runner.os }}",
              "resources": {
                "cpu_count": ${{ steps.envinfo.outputs.cpu_count }},
                "memory_mb": ${{ steps.envinfo.outputs.memory_mb }},
                "disk_free_mb": ${{ steps.envinfo.outputs.disk_free_mb }}
              }
            },
            "dependencies": {
              "lockfile_sha": "${{ steps.envinfo.outputs.lockfile_sha }}",
              "pip": $deps
            }
          }
          EOF