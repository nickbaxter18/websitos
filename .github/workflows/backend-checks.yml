name: Backend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [black, mypy, pytest, flake8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-json-report flake8 mypy black

      - name: Collect environment metadata
        id: envinfo
        run: |
          echo "lockfile_sha=$(sha256sum requirements.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "cpu_count=$(nproc)" >> $GITHUB_OUTPUT
          echo "memory_mb=$(free -m | awk '/Mem:/ {print $2}')" >> $GITHUB_OUTPUT
          echo "disk_free_mb=$(df -m . | awk 'NR==2 {print $4}')" >> $GITHUB_OUTPUT

      - name: Run ${{ matrix.task }}
        id: run_task
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          TASK="${{ matrix.task }}"
          set +e
          EXIT_CODE=0
          case "$TASK" in
            black)
              black --check .
              EXIT_CODE=$?
              ;;
            flake8)
              flake8
              EXIT_CODE=$?
              ;;
            mypy)
              mypy .
              EXIT_CODE=$?
              ;;
            pytest)
              pytest
              EXIT_CODE=$?
              ;;
            *)
              echo "Unknown backend task: $TASK" >&2
              EXIT_CODE=1
              ;;
          esac
          set -e
          STATUS="success"
          if [ "$EXIT_CODE" -ne 0 ]; then STATUS="failure"; fi
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: 📦 Write diagnostics JSON
        if: always()
        shell: bash
        run: |
          SCOPE="backend"
          JOB_KEY="backend-checks_${{ matrix.task }}"
          EXIT_CODE="${{ steps.run_task.outputs.exit_code }}"
          STATUS="${{ steps.run_task.outputs.status }}"
          if [ -z "$EXIT_CODE" ]; then EXIT_CODE=1; fi
          if [ -z "$STATUS" ]; then STATUS="success"; fi
          if [ "$EXIT_CODE" -ne 0 ]; then STATUS="failure"; fi
          mkdir -p "summaries/$SCOPE"
          tee "summaries/$SCOPE/${JOB_KEY}.json" <<EOF
{
  "job": "${JOB_KEY}",
  "status": "${STATUS}",
  "exit_code": ${EXIT_CODE},
  "metadata": {
    "tool": "${{ matrix.task }}",
    "version": "1.0.0"
  },
  "environment": {
    "runner": "Hosted Agent",
    "os": "ubuntu-latest"
  },
  "dependencies": {
    "npm": []
  }
}
EOF
          ls -lah "summaries/$SCOPE"
          cat "summaries/$SCOPE/${JOB_KEY}.json"
          if [ "$EXIT_CODE" -ne 0 ]; then exit "$EXIT_CODE"; fi

      - name: Upload diagnostics summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-summary-backend-checks_${{ matrix.task }}
          path: summaries/
          retention-days: 2
          if-no-files-found: error
