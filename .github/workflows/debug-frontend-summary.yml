name: Debug Frontend Summary

on:
  workflow_dispatch:

jobs:
  frontend-checks:
    strategy:
      matrix:
        task: [playwright-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: ✅ Job scheduled
        run: echo "Job is running: ${{ matrix.task }}"

      - name: 🧾 Write diagnostics JSON
        run: |
          mkdir -p summaries/frontend
          FILE="summaries/frontend/frontend-checks_${{ matrix.task }}.json"
          echo "📦 Writing to $FILE"

          echo '{
            "job": "frontend-checks/${{ matrix.task }}",
            "status": "success",
            "exit_code": 0,
            "metadata": {"tool": "playwright", "version": "1.55.0"},
            "environment": {"runner": "Hosted Agent", "os": "ubuntu-latest", "resources": {"cpu_count": 2, "memory_mb": 7086, "disk_free_mb": 102400}},
            "dependencies": {"lockfile_sha": "abc123", "npm": ["@playwright/test"]}
          }' > "$FILE"

          echo "✅ File contents:"
          cat "$FILE"
          echo "📂 Directory structure:"
          find summaries/ -type f -exec ls -lah {} +
        shell: bash

      - name: 🚀 Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2
          if-no-files-found: error