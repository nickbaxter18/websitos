name: Debug Frontend Summary

on:
  push:
  workflow_dispatch:

jobs:
  frontend-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: ✅ Job scheduled
        run: echo "Job is scheduled. github.job=${{ github.job }}"

      - name: 🧾 Write minimal diagnostics JSON
        run: |
          mkdir -p summaries/frontend
          FILE="summaries/frontend/${{ github.job }}.json"
          echo '{
            "job": "${{ github.job }}",
            "status": "success",
            "exit_code": 0,
            "metadata": {"tool": "playwright", "version": "1.55.0"},
            "environment": {"runner": "Hosted Agent", "os": "ubuntu-latest", "resources": {"cpu_count": 2, "memory_mb": 7086, "disk_free_mb": 102400}},
            "dependencies": {"lockfile_sha": "abc123", "npm": ["@playwright/test"]}
          }' > "$FILE"
          echo "✅ File written to $FILE"
          cat "$FILE"

      - name: 🚀 Upload for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2
          if-no-files-found: error