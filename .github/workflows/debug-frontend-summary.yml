name: Debug Frontend Summary

on:
  workflow_dispatch:
  push:

jobs:
  frontend-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: ✅ Job scheduled
        run: echo "github.job = frontend-checks/playwright-e2e"

      - name: 🧾 Write JSON with known diagnostics job ID
        run: |
          mkdir -p summaries/frontend
          FILE="summaries/frontend/frontend-checks_playwright-e2e.json"
          echo "📦 Writing to $FILE"

          echo '{
            "job": "frontend-checks/playwright-e2e",
            "status": "success",
            "exit_code": 0,
            "metadata": {"tool": "playwright", "version": "1.55.0"},
            "environment": {"runner": "Hosted Agent", "os": "ubuntu-latest", "resources": {"cpu_count": 2, "memory_mb": 7086, "disk_free_mb": 102400}},
            "dependencies": {"lockfile_sha": "abc123", "npm": ["@playwright/test"]}
          }' > "$FILE"

          echo "✅ File contents:"
          cat "$FILE"
        shell: bash

      - name: 🚀 Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2
          if-no-files-found: error