name: Frontend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  diagnostics-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📛 Show GitHub Job ID
        run: echo "github.job=${{ github.job }}"
        shell: bash

      - name: 🧾 Write dynamic job-matching JSON
        run: |
          set -euxo pipefail
          JOB_ID="${{ github.job }}"
          FILE="summaries/frontend/${JOB_ID}.json"
          mkdir -p summaries/frontend
          cat <<EOF > "$FILE"
          {
            "job": "$JOB_ID",
            "status": "success",
            "exit_code": 0,
            "metadata": {
              "tool": "playwright",
              "version": "1.55.0"
            },
            "environment": {
              "runner": "Hosted Agent",
              "os": "ubuntu-latest",
              "resources": {
                "cpu_count": 2,
                "memory_mb": 7086,
                "disk_free_mb": 102400
              }
            },
            "dependencies": {
              "lockfile_sha": "abc123",
              "npm": ["@playwright/test"]
            }
          }
          EOF
          echo "✅ JSON written to $FILE"
          cat "$FILE"
        shell: bash

      - name: 🚀 Upload for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2
          if-no-files-found: error