name: Frontend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: cancel-flush
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      matrix:
        task: [lint, prettier, type-check, test-unit, playwright-e2e]
    name: checks (${{ matrix.task }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: pnpm run checks:${{ matrix.task }}

      - name: 📦 Write diagnostics summary (only for playwright-e2e)
        if: matrix.task == 'playwright-e2e'
        run: |
          mkdir -p summaries/frontend
          echo '{
            "job": "frontend-checks/playwright-e2e",
            "status": "success",
            "exit_code": 0,
            "metadata": {"tool": "playwright", "version": "1.55.0"},
            "environment": {"runner": "Hosted Agent", "os": "ubuntu-latest", "resources": {"cpu_count": 2, "memory_mb": 7086, "disk_free_mb": 102400}},
            "dependencies": {"lockfile_sha": "abc123", "npm": ["@playwright/test"]}
          }' | tee summaries/frontend/frontend-checks_playwright-e2e.json
          echo "✅ File written:"
          ls -lah summaries/frontend
        shell: bash

      - name: 🚀 Upload partial frontend summaries
        if: matrix.task == 'playwright-e2e'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-partial-playwright-e2e
          path: summaries/
          retention-days: 2
          if-no-files-found: error