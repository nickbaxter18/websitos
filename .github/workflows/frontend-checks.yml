name: Frontend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  frontend-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: 🟢 Job scheduled check
        run: echo "✅ Job is running!"
        shell: bash

      - name: 🧾 Write JSON + confirm all steps
        run: |
          echo "=================="
          echo "github.job = ${{ github.job }}"
          echo "=================="

          mkdir -p summaries/frontend
          echo "📂 summaries/ (pre):" && ls -lahR summaries

          FILE="summaries/frontend/${{ github.job }}.json"
          echo "📦 Writing to $FILE"

          cat <<EOF > "$FILE"
          {
            "job": "${{ github.job }}",
            "status": "success",
            "exit_code": 0,
            "metadata": {
              "tool": "playwright",
              "version": "1.55.0"
            },
            "environment": {
              "runner": "Hosted Agent",
              "os": "ubuntu-latest",
              "resources": {
                "cpu_count": 2,
                "memory_mb": 7086,
                "disk_free_mb": 102400
              }
            },
            "dependencies": {
              "lockfile_sha": "abc123",
              "npm": ["@playwright/test"]
            }
          }
          EOF

          echo "✅ File content:"
          cat "$FILE"
          echo "📂 summaries/ (post):" && find summaries/ -type f -exec ls -lah {} +
        shell: bash

      - name: 🚀 Upload for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2
          if-no-files-found: error