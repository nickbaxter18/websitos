name: Frontend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: cancel-flush
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      matrix:
        task: [lint, prettier, type-check, test-unit, playwright-e2e]
    name: checks (${{ matrix.task }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        id: run_task
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e
          pnpm run checks:${{ matrix.task }}
          EXIT_CODE=$?
          set -e
          STATUS="success"
          if [ "$EXIT_CODE" -ne 0 ]; then STATUS="failure"; fi
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: 📦 Write diagnostics JSON
        if: always()
        shell: bash
        run: |
          SCOPE="frontend"
          JOB_KEY="frontend-checks_${{ matrix.task }}"
          EXIT_CODE="${{ steps.run_task.outputs.exit_code }}"
          STATUS="${{ steps.run_task.outputs.status }}"
          if [ -z "$EXIT_CODE" ]; then EXIT_CODE=1; fi
          if [ -z "$STATUS" ]; then STATUS="success"; fi
          if [ "$EXIT_CODE" -ne 0 ]; then STATUS="failure"; fi
          mkdir -p "summaries/$SCOPE"
          tee "summaries/$SCOPE/${JOB_KEY}.json" <<EOF
{
  "job": "${JOB_KEY}",
  "status": "${STATUS}",
  "exit_code": ${EXIT_CODE},
  "metadata": {
    "tool": "${{ matrix.task }}",
    "version": "1.0.0"
  },
  "environment": {
    "runner": "Hosted Agent",
    "os": "ubuntu-latest"
  },
  "dependencies": {
    "npm": []
  }
}
EOF
          ls -lah "summaries/$SCOPE"
          cat "summaries/$SCOPE/${JOB_KEY}.json"
          if [ "$EXIT_CODE" -ne 0 ]; then exit "$EXIT_CODE"; fi

      - name: Upload diagnostics summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-summary-frontend-checks_${{ matrix.task }}
          path: summaries/
          retention-days: 2
          if-no-files-found: error
