name: Frontend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, prettier, type-check, test-unit, playwright-e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect environment metadata
        id: envinfo
        run: |
          echo "lockfile_sha=$(sha256sum pnpm-lock.yaml | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "cpu_count=$(nproc)" >> $GITHUB_OUTPUT
          echo "memory_mb=$(free -m | awk '/Mem:/ {print $2}')" >> $GITHUB_OUTPUT
          echo "disk_free_mb=$(df -m . | awk 'NR==2 {print $4}')" >> $GITHUB_OUTPUT

      - name: Run ESLint
        if: ${{ matrix.task == 'lint' }}
        run: |
          mkdir -p summaries
          start=$(date +%s)
          pnpm exec eslint src v2 ops --format json -o eslint-output.json || true
          eslint_exit=$?
          end=$(date +%s)
          duration="$((end-start))s"

          sha256=$(sha256sum eslint-output.json | awk '{print $1}' || echo "")
          deps=$(pnpm list --depth 0 --json || echo '[]')
          echo "$deps" | jq . >/dev/null 2>&1 || deps="[]"

          errors=$(jq '[.[] | .messages[] | select(.severity==2)] | length' eslint-output.json 2>/dev/null || echo 0)
          warnings=$(jq '[.[] | .messages[] | select(.severity==1)] | length' eslint-output.json 2>/dev/null || echo 0)

          cat <<EOF > summaries/frontend-eslint-diagnostics.json
          {
            "job": "frontend-checks/eslint",
            "exit_code": $eslint_exit,
            "status": "$( [ "$eslint_exit" -eq 0 ] && echo success || echo failure )",
            "errors": $errors,
            "warnings": $warnings,
            "messages": $(jq '[.[] | .messages[]]' eslint-output.json 2>/dev/null || echo []),
            "annotations": [],
            "tests": [],
            "coverage": {},
            "artifacts": ["summaries/eslint-output.json"],
            "metadata": {
              "tool": "eslint",
              "version": "$(pnpm list eslint | grep eslint | awk '{print $2}')",
              "duration": "$duration",
              "sha256": "$sha256",
              "fallback": false,
              "trace_id": "${{ github.sha }}"
            },
            "environment": {
              "runner": "${{ runner.name }}",
              "os": "${{ runner.os }}",
              "resources": {
                "cpu_count": ${{ steps.envinfo.outputs.cpu_count }},
                "memory_mb": ${{ steps.envinfo.outputs.memory_mb }},
                "disk_free_mb": ${{ steps.envinfo.outputs.disk_free_mb }}
              }
            },
            "dependencies": {
              "lockfile_sha": "${{ steps.envinfo.outputs.lockfile_sha }}",
              "npm": $deps
            }
          }
          EOF

          echo "✅ Wrote summaries/frontend-eslint-diagnostics.json"
          ls -lh summaries || true
          sha256sum summaries/* || true
          head -n 20 summaries/frontend-eslint-diagnostics.json

      - name: Validate ESLint artifacts before upload
        if: ${{ matrix.task == 'lint' }}
        run: |
          echo "📂 Summaries before upload (ESLint):"
          ls -lh summaries || true

      # Similar debugging will be applied to Prettier, TSC, Jest, Playwright jobs
      # Each will log summaries directory, hash files, and preview JSON before upload

      - name: Upload partial frontend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2