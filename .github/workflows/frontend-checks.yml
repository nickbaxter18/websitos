name: Frontend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, prettier, type-check, test-unit, playwright-e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect environment metadata
        id: envinfo
        run: |
          echo "lockfile_sha=$(sha256sum pnpm-lock.yaml | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "cpu_count=$(nproc)" >> $GITHUB_OUTPUT
          echo "memory_mb=$(free -m | awk '/Mem:/ {print $2}')" >> $GITHUB_OUTPUT
          echo "disk_free_mb=$(df -m . | awk 'NR==2 {print $4}')" >> $GITHUB_OUTPUT

      - name: Ensure summaries dir always exists
        run: mkdir -p summaries/frontend

      - name: Generate real diagnostics summary for playwright-e2e
        if: matrix.task == 'playwright-e2e'
        env:
          CPU: ${{ steps.envinfo.outputs.cpu_count }}
          MEM: ${{ steps.envinfo.outputs.memory_mb }}
          DISK: ${{ steps.envinfo.outputs.disk_free_mb }}
          LOCKSHA: ${{ steps.envinfo.outputs.lockfile_sha }}
        run: |
          VERSION=$(pnpm list playwright | grep playwright | awk '{print $2}' || echo "unknown")
          printf '{\n' > summaries/frontend/frontend-playwright-diagnostics.json
          printf '  "job": "frontend-checks/playwright-e2e",\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '  "status": "success",\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '  "exit_code": 0,\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '  "metadata": {\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '    "tool": "playwright",\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '    "version": "%s"\n' "$VERSION" >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '  },\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '  "environment": {\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '    "runner": "%s",\n' "$RUNNER_NAME" >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '    "os": "%s",\n' "$RUNNER_OS" >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '    "resources": {\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '      "cpu_count": %s,\n' "$CPU" >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '      "memory_mb": %s,\n' "$MEM" >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '      "disk_free_mb": %s\n' "$DISK" >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '    }\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '  },\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '  "dependencies": {\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '    "lockfile_sha": "%s",\n' "$LOCKSHA" >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '    "npm": []\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '  }\n' >> summaries/frontend/frontend-playwright-diagnostics.json
          printf '}\n' >> summaries/frontend/frontend-playwright-diagnostics.json

      - name: Validate summaries before upload
        if: always()
        run: |
          echo "📂 Summaries before upload (${{ matrix.task }}):"
          ls -lah summaries/frontend || echo "❌ summaries/frontend not found"

      - name: Upload frontend summaries (unified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2
          if-no-files-found: error