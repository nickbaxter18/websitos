name: Frontend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  diagnostics-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📛 Dump GitHub Job + Context Info
        run: |
          echo "github.job = ${{ github.job }}"
          echo "github.workflow = ${{ github.workflow }}"
          echo "github.run_id = ${{ github.run_id }}"
          echo "github.run_number = ${{ github.run_number }}"
          echo "runner.name = ${{ runner.name }}"
          echo "runner.os = ${{ runner.os }}"
        shell: bash

      - name: 📁 List summaries folder (debug only)
        run: |
          mkdir -p summaries/frontend
          ls -lahR summaries || echo "No summaries yet"
        shell: bash

      - name: 🧾 Write minimal diagnostic JSON
        run: |
          FILE=summaries/frontend/frontend-checks_playwright-e2e.json
          echo '{"job": "frontend-checks/playwright-e2e", "status": "success", "exit_code": 0, "metadata": {"tool": "test", "version": "1.0.0"}, "environment": {"runner": "debug", "os": "ubuntu"}, "dependencies": {"lockfile_sha": "abc123", "npm": []}}' > "$FILE"
          cat "$FILE"
        shell: bash

      - name: 🚀 Upload diagnostic file in full path
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2
          if-no-files-found: error