name: Frontend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, prettier, type-check, test-unit, test-e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        if: ${{ matrix.task == 'lint' }}
        run: |
          pnpm exec eslint src v2 ops --format json --output-file eslint-output.json || true
          node Scripts/convert-eslint.js eslint-output.json eslint-report.json || echo '{"workflow":"frontend-checks","job":"lint","status":"success","errors":[],"warnings":[],"notices":[]}' > eslint-report.json
          echo "📂 Dumping eslint-report.json for debug"
          cat eslint-report.json || true
          mkdir -p summaries && mv eslint-report.json summaries/

      - name: Run Prettier
        if: ${{ matrix.task == 'prettier' }}
        run: |
          pnpm exec prettier --check . > prettier-output.txt 2>&1 || true
          node Scripts/convert-prettier.js prettier-output.txt prettier-report.json || echo '{"workflow":"frontend-checks","job":"prettier","status":"success","errors":[],"warnings":[],"notices":[]}' > prettier-report.json
          echo "📂 Dumping prettier-report.json for debug"
          cat prettier-report.json || true
          mkdir -p summaries && mv prettier-report.json summaries/

      - name: Run TypeScript type-check
        if: ${{ matrix.task == 'type-check' }}
        run: |
          pnpm exec tsc -p tsconfig.ci.json --noEmit --skipLibCheck > tsc-output.txt 2>&1 || true
          node Scripts/convert-tsc.js tsc-output.txt tsc-report.json || echo '{"workflow":"frontend-checks","job":"tsc","status":"success","errors":[],"warnings":[],"notices":[]}' > tsc-report.json
          echo "📂 Dumping tsc-report.json for debug"
          cat tsc-report.json || true
          mkdir -p summaries && mv tsc-report.json summaries/

      - name: Run Jest unit tests
        if: ${{ matrix.task == 'test-unit' }}
        run: |
          pnpm exec jest --coverage --json --outputFile=jest-output.json || true
          node Scripts/convert-jest.js jest-output.json jest-report.json || echo '{"workflow":"frontend-checks","job":"jest-unit","status":"success","errors":[],"warnings":[],"notices":[]}' > jest-report.json
          echo "📂 Dumping jest-report.json for debug"
          cat jest-report.json || true
          mkdir -p summaries && mv jest-report.json summaries/

      - name: Run Playwright E2E tests
        if: ${{ matrix.task == 'test-e2e' }}
        shell: bash {0}
        run: |
          pnpm exec playwright install --with-deps || true
          (pnpm exec playwright test 2>&1 | tee playwright-output.txt) || true
          echo "${PIPESTATUS[0]}" > exit-code.txt || true
          (npx nyc report --reporter=json-summary --report-dir=coverage/e2e) || true

          node Scripts/convert-playwright.cjs playwright-output.txt coverage/e2e/coverage-summary.json playwright-report.json || true

          if [ ! -s playwright-report.json ]; then
            echo '{"workflow":"frontend-checks","job":"test-e2e","status":"failure","errors":[{"message":"No report generated"}],"warnings":[],"notices":[]}' > playwright-report.json
          fi

          echo "📂 Checking playwright-report.json:"
          ls -lh playwright-report.json || true
          cat playwright-report.json || true

          mkdir -p summaries
          mv playwright-report.json summaries/ || true
          mv coverage/e2e/coverage-summary.json summaries/playwright-coverage-report.json || true

          cp playwright-output.txt summaries/playwright-output.txt || true
          cp exit-code.txt summaries/exit-code.txt || true

          if [ ! -s summaries/playwright-report.json ]; then
            echo '{"workflow":"frontend-checks","job":"test-e2e","status":"neutral","errors":[],"warnings":[],"notices":[{"message":"dummy fallback created"}]}' > summaries/playwright-report.json
          fi

          echo '{"artifact":"frontend-partial-test-e2e","files":["playwright-report.json","playwright-output.txt","exit-code.txt","playwright-coverage-report.json"]}' > summaries/e2e-meta.json

          echo "📂 Contents of summaries before upload (with sizes):"
          ls -lah summaries || true

      - name: Upload frontend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

      - name: Upload raw E2E logs
        if: ${{ matrix.task == 'test-e2e' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-raw-logs
          path: raw-logs/
          retention-days: 2

  package-and-upload:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all frontend job artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded

      - name: Collect frontend summaries
        run: |
          mkdir -p summaries
          echo "📥 Checking downloaded artifacts:"
          ls -R downloaded || true

          for f in $(find downloaded -type f -iname "*-report.json"); do
            echo "📥 Found report: $f"
            cp "$f" summaries/
          done

          # Explicitly check and copy playwright-report.json if it exists
          cp downloaded/**/playwright-report.json summaries/ 2>/dev/null || echo "⚠️ No playwright-report.json found in artifacts"

          # Ensure critical reports exist (fallback if missing)
          for required in playwright-report.json eslint-report.json prettier-report.json tsc-report.json jest-report.json; do
            if [ ! -f summaries/$required ]; then
              echo "⚠️ Missing $required in summaries/"
              echo '{"workflow":"frontend-checks","job":"missing","status":"neutral","errors":[],"warnings":[],"notices":[{"message":"'$required' missing from artifact collection"}]}' > summaries/$required
            fi
          done

          echo "📂 Collected summaries (with sizes):"
          ls -lah summaries || true

          # Metadata summary
          ls -lah summaries > summaries/frontend-meta.txt

      - name: Upload combined frontend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2