name: Frontend Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  diagnostics-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOB_ID: ${{ github.job }}
    steps:
      - name: 📛 Print GitHub job context
        run: |
          echo "=================="
          echo "github.job = $JOB_ID"
          echo "github.workflow = ${{ github.workflow }}"
          echo "runner.os = ${{ runner.os }}"
          echo "=================="
        shell: bash

      - name: 📂 Pre-check summaries folder (before write)
        run: |
          mkdir -p summaries/frontend
          echo "📦 Before write contents:" && ls -lahR summaries || echo "(empty)"
        shell: bash

      - name: 🧾 Write and verify JSON summary
        run: |
          set -euxo pipefail
          FILE="summaries/frontend/$JOB_ID.json"
          cat <<EOF > "$FILE"
          {
            "job": "$JOB_ID",
            "status": "success",
            "exit_code": 0,
            "metadata": {
              "tool": "playwright",
              "version": "1.55.0"
            },
            "environment": {
              "runner": "Hosted Agent",
              "os": "ubuntu-latest",
              "resources": {
                "cpu_count": 2,
                "memory_mb": 7086,
                "disk_free_mb": 102400
              }
            },
            "dependencies": {
              "lockfile_sha": "abc123",
              "npm": ["@playwright/test"]
            }
          }
          EOF
          echo "✅ File written to $FILE"
          ls -lah summaries/frontend
          cat "$FILE"
        shell: bash

      - name: 📦 Final artifact file listing
        run: find summaries/ -type f -exec ls -lah {} +
        shell: bash

      - name: 🚀 Upload for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2
          if-no-files-found: error