name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  # ---------------------------
  # Frontend Jobs
  # ---------------------------
  frontend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, prettier, type-check, test-unit, playwright-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      # (frontend steps unchanged...)

  # ---------------------------
  # Backend Jobs
  # ---------------------------
  backend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [black, mypy, pytest, flake8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-json-report flake8 mypy black

      # (backend steps unchanged...)

  # ---------------------------
  # Coverage Jobs
  # ---------------------------
  coverage-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [frontend, backend, backend-node, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        if: ${{ matrix.task != 'backend' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        if: ${{ matrix.task == 'frontend' || matrix.task == 'e2e' || matrix.task == 'backend-node' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Setup Python
        if: ${{ matrix.task == 'backend' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # (coverage steps unchanged...)

  # ---------------------------
  # Central Diagnostics (Reusable Workflow)
  # ---------------------------
  diagnostics:
    needs: [frontend-checks, backend-checks, coverage-checks]
    uses: ./.github/workflows/ci-diagnostics.yml
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}