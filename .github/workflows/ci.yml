name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  # ---------------------------
  # Frontend Jobs
  # ---------------------------
  frontend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, prettier, type-check, test-unit, playwright-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      # (frontend steps unchanged...)

  # ---------------------------
  # Backend Jobs
  # ---------------------------
  backend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    ... (backend steps unchanged)

  # ---------------------------
  # Coverage Jobs
  # ---------------------------
  coverage-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    ... (coverage steps unchanged)

  # ---------------------------
  # Central Diagnostics (Reusable Workflow)
  # ---------------------------
  diagnostics:
    needs: [frontend-checks, backend-checks, coverage-checks]
    uses: ./.github/workflows/ci-diagnostics.yml
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}