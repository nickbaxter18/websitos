name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  # (frontend-checks, backend-checks, coverage-checks jobs unchanged)

  package-frontend:
    if: always()
    runs-on: ubuntu-latest
    needs: frontend-checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all frontend job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-partial-*
          path: ./downloaded
          merge-multiple: true
      - name: Debug downloaded artifacts
        run: |
          echo "📂 Downloaded artifacts for frontend packaging:"
          ls -lhR downloaded || true
      - name: Collect frontend summaries
        run: |
          mkdir -p summaries
          find downloaded -type f -exec cp {} summaries/ \; || true
          touch summaries/placeholder.txt
          sha256sum summaries/* > summaries/checksums.txt || true
          date -u "+%Y-%m-%dT%H:%M:%SZ" > summaries/timestamp.txt
          echo "📦 Packaged frontend summaries:" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
          echo "📂 Final summaries before upload:"
          ls -lh summaries || true
          echo "📑 File hashes before upload:"
          find summaries -type f -exec sha256sum {} \; || true
      - name: Ensure placeholder if no reports
        run: |
          mkdir -p summaries
          if [ -z "$(find summaries -name '*-report.json')" ]; then
            echo '{"workflow":"${{ github.job }}","job":"placeholder","status":"no data","errors":[],"warnings":[],"notices":[]}' > summaries/placeholder-report.json
          fi
      - name: Upload raw summaries dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.job }}-summaries
          path: summaries/
          retention-days: 2
      - name: Upload combined frontend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2

  package-backend:
    if: always()
    runs-on: ubuntu-latest
    needs: backend-checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all backend job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-partial-*
          path: ./downloaded
          merge-multiple: true
      - name: Debug downloaded artifacts
        run: |
          echo "📂 Downloaded artifacts for backend packaging:"
          ls -lhR downloaded || true
      - name: Collect backend summaries
        run: |
          mkdir -p summaries
          find downloaded -type f -exec cp {} summaries/ \; || true
          touch summaries/placeholder.txt
          sha256sum summaries/* > summaries/checksums.txt || true
          date -u "+%Y-%m-%dT%H:%M:%SZ" > summaries/timestamp.txt
          echo "📦 Packaged backend summaries:" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
          echo "📂 Final summaries before upload:"
          ls -lh summaries || true
          echo "📑 File hashes before upload:"
          find summaries -type f -exec sha256sum {} \; || true
      - name: Ensure placeholder if no reports
        run: |
          mkdir -p summaries
          if [ -z "$(find summaries -name '*-report.json')" ]; then
            echo '{"workflow":"${{ github.job }}","job":"placeholder","status":"no data","errors":[],"warnings":[],"notices":[]}' > summaries/placeholder-report.json
          fi
      - name: Upload raw summaries dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.job }}-summaries
          path: summaries/
          retention-days: 2
      - name: Upload combined backend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-summaries
          path: summaries/
          retention-days: 2

  package-coverage:
    if: always()
    runs-on: ubuntu-latest
    needs: coverage-checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all coverage job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-partial-*
          path: ./downloaded
          merge-multiple: true
      - name: Debug downloaded artifacts
        run: |
          echo "📂 Downloaded artifacts for coverage packaging:"
          ls -lhR downloaded || true
      - name: Collect coverage summaries
        run: |
          mkdir -p summaries
          find downloaded -type f -exec cp {} summaries/ \; || true
          touch summaries/placeholder.txt
          sha256sum summaries/* > summaries/checksums.txt || true
          date -u "+%Y-%m-%dT%H:%M:%SZ" > summaries/timestamp.txt
          echo "📦 Packaged coverage summaries:" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
          echo "📂 Final summaries before upload:"
          ls -lh summaries || true
          echo "📑 File hashes before upload:"
          find summaries -type f -exec sha256sum {} \; || true
      - name: Ensure placeholder if no reports
        run: |
          mkdir -p summaries
          if [ -z "$(find summaries -name '*-report.json')" ]; then
            echo '{"workflow":"${{ github.job }}","job":"placeholder","status":"no data","errors":[],"warnings":[],"notices":[]}' > summaries/placeholder-report.json
          fi
      - name: Upload raw summaries dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.job }}-summaries
          path: summaries/
          retention-days: 2
      - name: Upload combined coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: summaries/
          retention-days: 2

  diagnostics:
    if: always()
    needs: [package-frontend, package-backend, package-coverage]
    uses: ./.github/workflows/ci-diagnostics.yml