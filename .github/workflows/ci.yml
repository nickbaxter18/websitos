name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  # ---------------------------
  # Frontend Jobs
  # ---------------------------
  frontend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, prettier, type-check, test-unit, playwright-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      # (frontend job steps unchanged — still produce partial artifacts)

      - name: Upload partial frontend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

  package-frontend:
    runs-on: ubuntu-latest
    needs: frontend-checks
    steps:
      - uses: actions/checkout@v4
      - name: Download all frontend job artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded
      - name: Collect frontend summaries
        run: |
          mkdir -p summaries
          find downloaded -type f -iname "*-report.json" -exec cp {} summaries/ \;
          find downloaded -type f -iname "artifact-manifest.txt" -exec cp {} summaries/ \;
          echo "📦 Packaged frontend summaries:" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
      - name: Upload combined frontend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2

  # ---------------------------
  # Backend Jobs
  # ---------------------------
  backend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [black, mypy, pytest, flake8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-json-report flake8 mypy black

      # (backend job steps unchanged — still produce partial artifacts)

      - name: Upload partial backend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

  package-backend:
    runs-on: ubuntu-latest
    needs: backend-checks
    steps:
      - uses: actions/checkout@v4
      - name: Download all backend job artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded
      - name: Collect backend summaries
        run: |
          mkdir -p summaries
          find downloaded -type f -iname "*-report.json" -exec cp {} summaries/ \;
          find downloaded -type f -iname "artifact-manifest.txt" -exec cp {} summaries/ \;
          echo "📦 Packaged backend summaries:" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
      - name: Upload combined backend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-summaries
          path: summaries/
          retention-days: 2

  # ---------------------------
  # Coverage Jobs
  # ---------------------------
  coverage-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [frontend, backend, backend-node, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        if: ${{ matrix.task != 'backend' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        if: ${{ matrix.task == 'frontend' || matrix.task == 'e2e' || matrix.task == 'backend-node' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Setup Python
        if: ${{ matrix.task == 'backend' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # (coverage job steps unchanged — still produce partial artifacts)

      - name: Upload partial coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

  package-coverage:
    runs-on: ubuntu-latest
    needs: coverage-checks
    steps:
      - uses: actions/checkout@v4
      - name: Download all coverage job artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded
      - name: Collect coverage summaries
        run: |
          mkdir -p summaries
          find downloaded -type f -iname "*-report.json" -exec cp {} summaries/ \;
          find downloaded -type f -iname "artifact-manifest.txt" -exec cp {} summaries/ \;
          echo "📦 Packaged coverage summaries:" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
      - name: Upload combined coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: summaries/
          retention-days: 2

  # ---------------------------
  # Central Diagnostics (Reusable Workflow)
  # ---------------------------
  diagnostics:
    needs: [package-frontend, package-backend, package-coverage]
    uses: ./.github/workflows/ci-diagnostics.yml
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}