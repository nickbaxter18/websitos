name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, prettier, type-check, test-unit, playwright-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Upload partial frontend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

  package-frontend:
    if: always()
    runs-on: ubuntu-latest
    needs: frontend-checks
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all frontend job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-partial-*
          path: ./downloaded
          merge-multiple: true
      - name: Collect frontend summaries
        run: |
          mkdir -p summaries
          find downloaded -type f -iname "*-report.json" -exec cp {} summaries/ \; || true
          touch summaries/placeholder.txt
          sha256sum summaries/* > summaries/checksums.txt || true
      - name: Upload combined frontend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-summaries
          path: summaries/
          retention-days: 2

  backend-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [black, mypy, pytest, flake8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-json-report flake8 mypy black
      - name: Upload partial backend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

  package-backend:
    if: always()
    runs-on: ubuntu-latest
    needs: backend-checks
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all backend job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-partial-*
          path: ./downloaded
          merge-multiple: true
      - name: Collect backend summaries
        run: |
          mkdir -p summaries
          find downloaded -type f -iname "*-report.json" -exec cp {} summaries/ \; || true
          touch summaries/placeholder.txt
          sha256sum summaries/* > summaries/checksums.txt || true
      - name: Upload combined backend summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-summaries
          path: summaries/
          retention-days: 2

  coverage-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [frontend, backend, backend-node, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        if: ${{ matrix.task != 'backend' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        if: ${{ matrix.task == 'frontend' || matrix.task == 'e2e' || matrix.task == 'backend-node' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Setup Python
        if: ${{ matrix.task == 'backend' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upload partial coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

  package-coverage:
    if: always()
    runs-on: ubuntu-latest
    needs: coverage-checks
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all coverage job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-partial-*
          path: ./downloaded
          merge-multiple: true
      - name: Collect coverage summaries
        run: |
          mkdir -p summaries
          find downloaded -type f -iname "*-report.json" -exec cp {} summaries/ \; || true
          touch summaries/placeholder.txt
          sha256sum summaries/* > summaries/checksums.txt || true
      - name: Upload combined coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: summaries/
          retention-days: 2

  diagnostics:
    if: always()
    needs: [package-frontend, package-backend, package-coverage]
    uses: ./.github/workflows/ci-diagnostics.yml
    secrets: inherit