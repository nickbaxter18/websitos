name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug Environment Info (Frontend)
        run: |
          echo "=== FRONTEND ENV DEBUG ==="
          node -v || true
          npm -v || true
          pnpm -v || true
          python3 --version || true
          pip3 list || true
          echo "Workspace files:" 
          ls -R || true

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug Environment Info (Backend)
        run: |
          echo "=== BACKEND ENV DEBUG ==="
          node -v || true
          npm -v || true
          pnpm -v || true
          python3 --version || true
          pip3 list || true
          echo "Workspace files:" 
          ls -R || true

  coverage-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug Environment Info (Coverage)
        run: |
          echo "=== COVERAGE ENV DEBUG ==="
          node -v || true
          npm -v || true
          pnpm -v || true
          python3 --version || true
          pip3 list || true
          echo "Workspace files:" 
          ls -R || true

  diagnostics:
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks, coverage-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Debug Diagnostics Environment
        run: |
          echo "=== DIAGNOSTICS ENV DEBUG ==="
          printenv | sort || true
          echo "Workspace files before summaries check:" 
          ls -R || true
          echo "Summaries folder check:"
          ls -R summaries || true