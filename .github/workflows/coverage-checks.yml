name: Coverage Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  FRONTEND_COVERAGE_JSON: coverage/frontend/coverage-summary.json
  BACKEND_COVERAGE_XML: coverage/coverage.xml
  BACKEND_COVERAGE_JSON: coverage/coverage-summary.json
  BACKEND_NODE_COVERAGE_JSON: backend/coverage/coverage-summary.json
  E2E_COVERAGE_JSON: coverage/e2e/coverage-summary.json

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [frontend, backend, backend-node, e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Python
        if: ${{ matrix.task == 'backend' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Install backend test dependencies
        if: ${{ matrix.task == 'backend' }}
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r $GITHUB_WORKSPACE/requirements.txt

      - name: Collect environment metadata
        id: envinfo
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "lockfile_sha=$(sha256sum pnpm-lock.yaml | awk '{print $1}')" >> $GITHUB_OUTPUT
          elif [ -f requirements.txt ]; then
            echo "lockfile_sha=$(sha256sum requirements.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          else
            echo "lockfile_sha=unknown" >> $GITHUB_OUTPUT
          fi
          echo "cpu_count=$(nproc)" >> $GITHUB_OUTPUT
          echo "memory_mb=$(free -m | awk '/Mem:/ {print $2}')" >> $GITHUB_OUTPUT
          echo "disk_free_mb=$(df -m . | awk 'NR==2 {print $4}')" >> $GITHUB_OUTPUT

      - name: Run ${{ matrix.task }} coverage
        id: run_task
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          TASK="${{ matrix.task }}"
          SCRIPT="coverage:${{ matrix.task }}"
          STATUS="success"
          EXIT_CODE=0
          set +e
          export SCRIPT
          if node -e "const pkg=require('./package.json'); const script=process.env.SCRIPT; process.exit(pkg.scripts && Object.prototype.hasOwnProperty.call(pkg.scripts, script) ? 0 : 1);"; then
            pnpm run "$SCRIPT"
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -ne 0 ]; then STATUS="failure"; fi
          else
            echo "No script $SCRIPT defined. Skipping execution." >&2
            STATUS="skipped"
            EXIT_CODE=0
          fi
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: 📦 Write diagnostics JSON
        if: always()
        shell: bash
        run: |
          SCOPE="coverage"
          JOB_KEY="coverage-checks_${{ matrix.task }}"
          EXIT_CODE="${{ steps.run_task.outputs.exit_code }}"
          STATUS="${{ steps.run_task.outputs.status }}"
          if [ -z "$EXIT_CODE" ]; then EXIT_CODE=1; fi
          if [ -z "$STATUS" ]; then STATUS="success"; fi
          if [ "$EXIT_CODE" -ne 0 ] && [ "$STATUS" = "success" ]; then STATUS="failure"; fi
          mkdir -p "summaries/$SCOPE"
          tee "summaries/$SCOPE/${JOB_KEY}.json" <<EOF
{
  "job": "${JOB_KEY}",
  "status": "${STATUS}",
  "exit_code": ${EXIT_CODE},
  "metadata": {
    "tool": "${{ matrix.task }}",
    "version": "1.0.0"
  },
  "environment": {
    "runner": "Hosted Agent",
    "os": "ubuntu-latest"
  },
  "dependencies": {
    "npm": []
  }
}
EOF
          ls -lah "summaries/$SCOPE"
          cat "summaries/$SCOPE/${JOB_KEY}.json"
          if [ "$EXIT_CODE" -ne 0 ]; then exit "$EXIT_CODE"; fi

      - name: Upload diagnostics summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-summary-coverage-checks_${{ matrix.task }}
          path: summaries/
          retention-days: 2
          if-no-files-found: error
