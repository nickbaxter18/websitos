name: Coverage Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [frontend, backend, backend-node, e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.task != 'backend' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        if: ${{ matrix.task != 'backend' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Python
        if: ${{ matrix.task == 'backend' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (pnpm)
        if: ${{ matrix.task != 'backend' }}
        run: pnpm install

      - name: Install backend test dependencies
        if: ${{ matrix.task == 'backend' }}
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r $GITHUB_WORKSPACE/requirements.txt

      - name: Run frontend coverage (Jest)
        if: ${{ matrix.task == 'frontend' }}
        run: |
          pnpm exec jest --config jest.config.cjs --coverage --all --coverageReporters=json-summary --coverageDirectory=coverage/frontend
          test -f coverage/frontend/coverage-summary.json
          pnpm exec node Scripts/convert-jest-coverage.cjs coverage/frontend/coverage-summary.json frontend-coverage-report.json 0
          mkdir -p summaries
          mv frontend-coverage-report.json summaries/
          mv coverage/frontend/coverage-summary.json summaries/coverage-frontend-raw.log
          sha256sum summaries/* > summaries/checksums.txt

      - name: Run backend coverage (Pytest)
        if: ${{ matrix.task == 'backend' }}
        working-directory: backend
        run: |
          pytest tests --maxfail=1 --disable-warnings -q --cov=backend --cov-branch \
            --cov-report=xml:coverage/backend/coverage.xml \
            --cov-report=json:coverage/backend/coverage-summary.json
          test -f coverage/backend/coverage.xml
          test -f coverage/backend/coverage-summary.json
          node $GITHUB_WORKSPACE/Scripts/convert-cobertura.cjs coverage/backend/coverage.xml backend-cobertura-report.json 0
          node $GITHUB_WORKSPACE/Scripts/convert-pytest-coverage.cjs coverage/backend/coverage-summary.json backend-coverage-report.json 0
          mkdir -p ../summaries
          mv backend-cobertura-report.json backend-coverage-report.json ../summaries/
          mv coverage/backend/coverage.xml ../summaries/coverage-backend-raw.xml
          mv coverage/backend/coverage-summary.json ../summaries/coverage-backend-raw.log
          sha256sum ../summaries/* > ../summaries/checksums.txt

      - name: Run backend-node coverage (Jest)
        if: ${{ matrix.task == 'backend-node' }}
        run: |
          pnpm exec jest --config jest.config.cjs --coverage --coverageReporters=json-summary --coverageDirectory=backend/coverage
          test -f backend/coverage/coverage-summary.json
          pnpm exec node Scripts/convert-jest-coverage.cjs backend/coverage/coverage-summary.json backend-node-coverage-report.json 0
          mkdir -p summaries
          mv backend-node-coverage-report.json summaries/
          mv backend/coverage/coverage-summary.json summaries/coverage-backend-node-raw.log
          sha256sum summaries/* > summaries/checksums.txt

      - name: Start preview server
        if: ${{ matrix.task == 'e2e' }}
        run: |
          pnpm exec vite preview --port=5173 &
          for i in {1..10}; do
            if curl -sSf http://localhost:5173 >/dev/null; then
              echo "Preview server is up";
              break;
            fi;
            echo "Waiting for preview server...";
            sleep 3;
          done

      - name: Run e2e coverage (Playwright)
        if: ${{ matrix.task == 'e2e' }}
        run: |
          pnpm exec playwright install --with-deps
          pnpm exec playwright test
          npx nyc report --reporter=json-summary --report-dir=coverage/e2e
          test -f coverage/e2e/coverage-summary.json
          pnpm exec node Scripts/convert-jest-coverage.cjs coverage/e2e/coverage-summary.json e2e-coverage-report.json 0
          mkdir -p summaries
          mv e2e-coverage-report.json summaries/
          mv coverage/e2e/coverage-summary.json summaries/coverage-e2e-raw.log
          sha256sum summaries/* > summaries/checksums.txt

      - name: Generate Artifact Manifest
        run: |
          echo "📦 Artifact manifest for coverage-${{ matrix.task }}" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt

      - name: Upload partial coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

  package-and-upload:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all coverage job artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded

      - name: Collect coverage summaries
        run: |
          mkdir -p summaries
          echo "📥 Collected coverage artifacts:" > summaries/artifact-manifest.txt
          find downloaded -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
          find downloaded -name "*-report.json" -exec cp {} summaries/ \;
          sha256sum summaries/* >> summaries/artifact-manifest.txt

      - name: Upload combined coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: summaries/
          retention-days: 2