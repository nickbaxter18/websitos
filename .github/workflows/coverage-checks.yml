name: Coverage Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  FRONTEND_COVERAGE_JSON: $GITHUB_WORKSPACE/coverage/frontend/coverage-summary.json
  BACKEND_COVERAGE_XML: $GITHUB_WORKSPACE/backend/coverage/coverage.xml
  BACKEND_COVERAGE_JSON: $GITHUB_WORKSPACE/backend/coverage/coverage-summary.json
  BACKEND_NODE_COVERAGE_JSON: $GITHUB_WORKSPACE/backend/coverage/coverage-summary.json
  E2E_COVERAGE_JSON: $GITHUB_WORKSPACE/coverage/e2e/coverage-summary.json

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [frontend, backend, backend-node, e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Python
        if: ${{ matrix.task == 'backend' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (pnpm)
        run: pnpm install

      - name: Install backend test dependencies
        if: ${{ matrix.task == 'backend' }}
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r $GITHUB_WORKSPACE/requirements.txt

      - name: Run frontend coverage (Jest)
        if: ${{ matrix.task == 'frontend' }}
        run: |
          pnpm exec jest --config jest.config.cjs --coverage --all --coverageReporters=json-summary --coverageDirectory=coverage/frontend
          test -s $FRONTEND_COVERAGE_JSON
          pnpm exec node $GITHUB_WORKSPACE/Scripts/convert-jest-coverage.cjs $FRONTEND_COVERAGE_JSON frontend-coverage-report.json 0
          mkdir -p summaries
          cp frontend-coverage-report.json summaries/ || true
          cp $FRONTEND_COVERAGE_JSON summaries/coverage-frontend-raw.log || true
          ls -R summaries/

      - name: Run backend coverage (Pytest)
        if: ${{ matrix.task == 'backend' }}
        working-directory: backend
        run: |
          pytest tests --maxfail=1 --disable-warnings -q --cov=backend --cov-branch \
            --cov-report=xml:coverage/coverage.xml \
            --cov-report=json:coverage/coverage-summary.json
          test -s $BACKEND_COVERAGE_XML
          test -s $BACKEND_COVERAGE_JSON
          pnpm exec node $GITHUB_WORKSPACE/Scripts/convert-cobertura.cjs $BACKEND_COVERAGE_XML backend-cobertura-report.json 0
          pnpm exec node $GITHUB_WORKSPACE/Scripts/convert-pytest-coverage.cjs $BACKEND_COVERAGE_JSON backend-coverage-report.json 0
          mkdir -p ../summaries
          cp backend-cobertura-report.json ../summaries/ || true
          cp backend-coverage-report.json ../summaries/ || true
          cp $BACKEND_COVERAGE_XML ../summaries/coverage-backend-raw.xml || true
          cp $BACKEND_COVERAGE_JSON ../summaries/coverage-backend-raw.log || true
          ls -R ../summaries/

      - name: Run backend-node coverage (Jest)
        if: ${{ matrix.task == 'backend-node' }}
        run: |
          pnpm exec jest --config jest.config.cjs --coverage --coverageReporters=json-summary --coverageDirectory=backend/coverage
          test -s $BACKEND_NODE_COVERAGE_JSON
          pnpm exec node $GITHUB_WORKSPACE/Scripts/convert-jest-coverage.cjs $BACKEND_NODE_COVERAGE_JSON backend-node-coverage-report.json 0
          mkdir -p summaries
          cp backend-node-coverage-report.json summaries/ || true
          cp $BACKEND_NODE_COVERAGE_JSON summaries/coverage-backend-node-raw.log || true
          ls -R summaries/

      - name: Build frontend for E2E
        if: ${{ matrix.task == 'e2e' }}
        run: pnpm exec vite build

      - name: Start preview server
        if: ${{ matrix.task == 'e2e' }}
        run: |
          pnpm exec vite preview --port=5173 &
          for i in {1..10}; do
            if curl -sSf http://localhost:5173 >/dev/null; then
              echo "Preview server is up";
              break;
            fi;
            echo "Waiting for preview server...";
            sleep 3;
          done

      - name: Run e2e coverage (Playwright)
        if: ${{ matrix.task == 'e2e' }}
        run: |
          pnpm exec playwright install --with-deps
          npx nyc --reporter=json --report-dir=.nyc_output --check-coverage=false pnpm exec playwright test
          npx nyc report --reporter=json-summary --report-dir=coverage/e2e
          test -s $E2E_COVERAGE_JSON
          pnpm exec node $GITHUB_WORKSPACE/Scripts/convert-jest-coverage.cjs $E2E_COVERAGE_JSON e2e-coverage-report.json 0
          mkdir -p summaries
          cp e2e-coverage-report.json summaries/ || true
          cp $E2E_COVERAGE_JSON summaries/coverage-e2e-raw.log || true
          ls -R summaries/

      - name: Generate Artifact Manifest
        run: |
          echo "📦 Artifact manifest for coverage-${{ matrix.task }}" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt

      - name: Upload partial coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 7

  package-and-upload:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all coverage job artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded

      - name: Collect coverage summaries
        run: |
          mkdir -p summaries
          echo "📥 Collected coverage artifacts:" > summaries/artifact-manifest.txt
          find downloaded -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
          cp $(find downloaded -name "*report.json" -o -name "*coverage-report.json" -o -name "*cobertura-report.json" -o -name "coverage-summary.json" -o -name "coverage.xml") summaries/ || true
          ls -R summaries/
          sha256sum summaries/* >> summaries/artifact-manifest.txt

      - name: Upload combined coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: summaries/
          retention-days: 7