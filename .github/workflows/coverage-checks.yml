name: Coverage Checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [frontend, backend, backend-node, e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.task != 'backend' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        if: ${{ matrix.task != 'backend' }}
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Python
        if: ${{ matrix.task == 'backend' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (pnpm workspace)
        if: ${{ matrix.task != 'backend' }}
        run: pnpm install

      - name: Install backend test dependencies
        if: ${{ matrix.task == 'backend' }}
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r $GITHUB_WORKSPACE/requirements.txt

      - name: Run frontend coverage (Jest)
        if: ${{ matrix.task == 'frontend' }}
        run: |
          pnpm --filter frontend exec jest --config jest.config.cjs --coverage --all --coverageReporters=json-summary
          test -f frontend/coverage/coverage-summary.json
          node Scripts/convert-jest-coverage.cjs frontend/coverage/coverage-summary.json frontend-coverage-report.json 0
          mkdir -p summaries
          mv frontend-coverage-report.json summaries/
          mv frontend/coverage/coverage-summary.json summaries/coverage-frontend-raw.log
          sha256sum summaries/* > summaries/checksums.txt

      - name: Run backend coverage (Pytest)
        if: ${{ matrix.task == 'backend' }}
        working-directory: backend
        run: |
          pytest tests --maxfail=1 --disable-warnings -q --cov=. --cov-branch --cov-report=xml:coverage/coverage.xml --cov-report=json:coverage/coverage-summary.json
          test -f coverage/coverage.xml
          test -f coverage/coverage-summary.json
          node ../Scripts/convert-cobertura.cjs coverage/coverage.xml backend-cobertura-report.json 0
          node ../Scripts/convert-pytest-coverage.cjs coverage/coverage-summary.json backend-coverage-report.json 0
          mkdir -p ../summaries
          mv backend-cobertura-report.json backend-coverage-report.json ../summaries/
          mv coverage/coverage.xml ../summaries/coverage-backend-raw.xml
          mv coverage/coverage-summary.json ../summaries/coverage-backend-raw.log
          sha256sum ../summaries/* > ../summaries/checksums.txt

      - name: Run backend-node coverage (Jest)
        if: ${{ matrix.task == 'backend-node' }}
        run: |
          pnpm --filter backend exec jest --config jest.config.cjs --coverage --coverageReporters=json-summary --coverageDirectory=coverage
          test -f backend/coverage/coverage-summary.json
          node Scripts/convert-jest-coverage.cjs backend/coverage/coverage-summary.json backend-node-coverage-report.json 0
          mkdir -p summaries
          mv backend-node-coverage-report.json summaries/
          mv backend/coverage/coverage-summary.json summaries/coverage-backend-node-raw.log
          sha256sum summaries/* > summaries/checksums.txt

      - name: Run e2e coverage (Playwright)
        if: ${{ matrix.task == 'e2e' }}
        run: |
          pnpm --filter e2e exec playwright install --with-deps
          pnpm --filter e2e exec playwright test
          npx nyc report --reporter=json-summary --report-dir=e2e/coverage
          test -f e2e/coverage/coverage-summary.json
          node Scripts/convert-jest-coverage.cjs e2e/coverage/coverage-summary.json e2e-coverage-report.json 0
          mkdir -p summaries
          mv e2e-coverage-report.json summaries/
          mv e2e/coverage/coverage-summary.json summaries/coverage-e2e-raw.log
          sha256sum summaries/* > summaries/checksums.txt

      - name: Generate Artifact Manifest
        run: |
          echo "📦 Artifact manifest for coverage-${{ matrix.task }}" > summaries/artifact-manifest.txt
          find summaries -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt

      - name: Upload partial coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-partial-${{ matrix.task }}
          path: summaries/
          retention-days: 2

  package-and-upload:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all coverage job artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded

      - name: Collect coverage summaries
        run: |
          mkdir -p summaries
          echo "📥 Collected coverage artifacts:" > summaries/artifact-manifest.txt
          find downloaded -type f -printf "%p (%s bytes)\n" >> summaries/artifact-manifest.txt
          find downloaded -name "*-report.json" -exec cp {} summaries/ \;
          sha256sum summaries/* >> summaries/artifact-manifest.txt

      - name: Upload combined coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries
          path: summaries/
          retention-days: 2