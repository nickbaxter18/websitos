name: CI Diagnostics

on:
  workflow_call:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  run-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend summaries
        uses: actions/download-artifact@v4
        with:
          name: frontend-summaries
          path: ./summaries/frontend

      - name: Download backend summaries
        uses: actions/download-artifact@v4
        with:
          name: backend-summaries
          path: ./summaries/backend

      - name: Download coverage summaries
        uses: actions/download-artifact@v4
        with:
          name: coverage-summaries
          path: ./summaries/coverage

      - name: Install aggregator dependencies in isolated dir
        shell: bash
        run: |
          mkdir -p .agg_tmp || true
          cd .agg_tmp
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save --legacy-peer-deps ajv-cli @octokit/rest

      - name: Run aggregator
        shell: bash
        run: node .github/scripts/aggregator.js

      - name: Upload Diagnostics Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-report
          path: |
            report.md
            diagnostics-meta.json

      - name: Post Diagnostics as Check
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('report.md') ? fs.readFileSync('report.md','utf-8').slice(0,60000) : '⚠️ Diagnostics report missing.';
            const meta = fs.existsSync('diagnostics-meta.json') ? JSON.parse(fs.readFileSync('diagnostics-meta.json','utf-8')) : { totalErrors: 0, totalWarnings: 0, jobs: 0, schemaFailures: 0, schemaPasses: 0, coverage: { covered: 0, missed: 0 } };

            let conclusion = "success";
            if (meta.schemaFailures > 0 || meta.totalErrors > 0) conclusion = "failure";
            else if (meta.totalWarnings > 0) conclusion = "neutral";

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `CI Diagnostics (${context.ref} @ ${context.sha.slice(0,7)})`,
              head_sha: context.sha,
              status: "completed",
              conclusion,
              output: {
                title: "Central CI Diagnostics Report",
                summary
              }
            });

      - name: Post Diagnostics as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('report.md')) return;
            const body = fs.readFileSync('report.md','utf-8').slice(0,65000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });