name: CI Diagnostics

on:
  workflow_call:

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  run-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend summaries
        uses: actions/download-artifact@v4
        with:
          name: frontend-summaries
          path: ./summaries/frontend

      - name: Download backend summaries
        uses: actions/download-artifact@v4
        with:
          name: backend-summaries
          path: ./summaries/backend

      - name: Download coverage summaries
        uses: actions/download-artifact@v4
        with:
          name: coverage-summaries
          path: ./summaries/coverage

      - name: Aggregate Diagnostics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p summaries
          echo "📂 Downloaded artifact tree:" && find summaries -type f -ls

          npm install -g ajv-cli jq @octokit/rest || true

          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          const { Octokit } = require("@octokit/rest");

          const baseDir = "summaries";
          const allReports = [];
          const manifests = [];
          const schemaPath = "diagnostics.schema.json";
          let schemaFailures = 0;
          let schemaPasses = 0;

          const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });

          async function fetchAnnotations() {
            try {
              const runId = process.env.GITHUB_RUN_ID;
              const repoParts = process.env.GITHUB_REPOSITORY.split("/");
              const { data: jobs } = await octokit.actions.listJobsForWorkflowRun({
                owner: repoParts[0],
                repo: repoParts[1],
                run_id: runId
              });
              for (const job of jobs.jobs) {
                if (!job.check_run_url) continue;
                const checkRunId = job.check_run_url.split("/").pop();
                try {
                  const { data: annotations } = await octokit.checks.listAnnotations({
                    owner: repoParts[0],
                    repo: repoParts[1],
                    check_run_id: checkRunId
                  });
                  if (annotations?.length > 0) {
                    const diagFile = path.join(baseDir, `${job.name.replace(/\s+/g, "-").toLowerCase()}-annotations.json`);
                    fs.writeFileSync(diagFile, JSON.stringify(annotations, null, 2));
                    allReports.push({
                      job: job.name,
                      errors: annotations.filter(a => a.annotation_level === "failure").length,
                      warnings: annotations.filter(a => a.annotation_level === "warning").length,
                      annotations
                    });
                  }
                } catch (e) {
                  console.error("⚠️ Failed to fetch annotations for job", job.name, e.message);
                }
              }
            } catch (e) {
              console.error("⚠️ Could not fetch annotations:", e.message);
            }
          }

          function validateSchema(file) {
            try {
              execSync(`ajv validate -s ${schemaPath} -d ${file}`, { stdio: "pipe" });
              schemaPasses++;
              return null;
            } catch (e) {
              schemaFailures++;
              return e.toString();
            }
          }

          function loadFiles(dir) {
            if (!fs.existsSync(dir)) return;
            for (const file of fs.readdirSync(dir)) {
              const full = path.join(dir, file);
              if (fs.statSync(full).isDirectory()) {
                loadFiles(full);
              } else if (file.endsWith("-diagnostics.json")) {
                try {
                  const data = JSON.parse(fs.readFileSync(full, "utf-8"));
                  data.__file = full;
                  const schemaError = validateSchema(full);
                  if (schemaError) {
                    data.schema_error = schemaError;
                    data.status = "failure";
                  }
                  allReports.push(data);
                } catch (e) {
                  schemaFailures++;
                  allReports.push({ job: file, status: "failure", errors: 1, warnings: 0, messages: [{ type: "error", message: `Failed to parse diagnostics: ${e.message}` }], schema_error: e.toString() });
                }
              } else if (file.endsWith("-report.json") || file.endsWith("-fallback.json")) {
                try {
                  const data = JSON.parse(fs.readFileSync(full, "utf-8"));
                  data.__file = full;
                  if (file.endsWith("-fallback.json")) data.fallback = true;
                  allReports.push(data);
                } catch (e) {
                  allReports.push({ job: file, status: "failure", errors: 1, warnings: 0, messages: [{ type: "error", message: `Failed to parse: ${e.message}` }] });
                }
              } else if (file === "artifact-manifest.txt") {
                manifests.push({ path: full, content: fs.readFileSync(full, "utf-8") });
              }
            }
          }

          (async () => {
            await fetchAnnotations();
            loadFiles(baseDir);

            let totalErrors = 0;
            let totalWarnings = 0;
            let totalCoverageLines = { covered: 0, missed: 0 };

            let summaryTable = "### 📊 Summary Table\\n\\n| Job | Errors | Warnings | Status | Schema Valid |\\n|-----|--------|----------|--------|--------------|\\n";
            let metadataTable = "\\n### 🛠 Tool Metadata\\n\\n| Job | Tool | Version | Exit Code | Duration | Fallback |\\n|-----|------|---------|-----------|----------|----------|\\n";

            let detailsSection = "\\n### ❌ Errors and ⚠️ Warnings by Job\\n";
            let warningsSection = "\\n### ⚠️ Consolidated Warnings\\n";
            let errorsSection = "\\n### ❌ Consolidated Errors\\n";
            let failedTestsSection = "\\n### 🧨 Consolidated Test Failures\\n";
            let testsSection = "\\n### 🧪 Test Results\\n";
            let schemaSection = "\\n### 📐 Schema Validation Details\\n";
            let coverageSection = "\\n### 📊 Coverage Summary\\n\\n| Job | Lines Covered | Lines Missed | Coverage % |\\n|-----|---------------|--------------|------------|\\n";
            let artifactLinksSection = "\\n### 📂 Consolidated Artifacts\\n";

            if (allReports.length === 0) {
              summaryTable += "| n/a | 0 | 0 | no reports found | n/a |\\n";
            }

            for (const r of allReports) {
              const errors = Number.isInteger(r.errors) ? r.errors : (r.errors?.length || 0);
              const warnings = Number.isInteger(r.warnings) ? r.warnings : (r.warnings?.length || 0);

              totalErrors += errors;
              totalWarnings += warnings;

              summaryTable += `| ${r.job || r.__file} | ${errors} | ${warnings} | ${r.status || "?"} | ${r.schema_error ? "❌" : "✅"} |\\n`;

              metadataTable += `| ${r.job || r.__file} | ${r.metadata?.tool || "?"} | ${r.metadata?.version || "?"} | ${r.exit_code ?? "?"} | ${r.metadata?.duration || "?"} | ${r.metadata?.fallback || false} |\\n`;

              if (r.annotations && r.annotations.length > 0) {
                detailsSection += `\\n**Annotations for ${r.job}:**\\n`;
                r.annotations.forEach(a => {
                  detailsSection += `- ${a.annotation_level}: ${a.message}${a.path ? ` (${a.path}:${a.start_line || ""})` : ""}\\n`;
                  if (a.annotation_level === "warning") {
                    warningsSection += `- ${r.job}: ${a.message}${a.path ? ` (${a.path}:${a.start_line || ""})` : ""}\\n`;
                  }
                  if (a.annotation_level === "failure") {
                    errorsSection += `- ${r.job}: ${a.message}${a.path ? ` (${a.path}:${a.start_line || ""})` : ""}\\n`;
                    failedTestsSection += `- ${r.job}: ${a.title || a.message}${a.path ? ` (${a.path}:${a.start_line || ""})` : ""}\\n`;
                  }
                });
              }
            }

            const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const reportOut = `## ⚠️ CI Diagnostics Report\\n\\n${summaryTable}\\n${metadataTable}\\n${coverageSection}\\n${schemaSection}\\n${detailsSection}\\n${warningsSection}\\n${errorsSection}\\n${failedTestsSection}\\n${testsSection}\\n${artifactLinksSection}\\n\\n🔗 [View workflow run](${runUrl})`;
            fs.writeFileSync("report.md", reportOut);
            fs.writeFileSync("diagnostics-meta.json", JSON.stringify({ totalErrors, totalWarnings, jobs: allReports.length, schemaFailures, schemaPasses, coverage: totalCoverageLines }, null, 2));

            if (schemaFailures > 0) process.exit(1);
          })();
          '

      - name: Upload Diagnostics Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-report
          path: |
            report.md
            diagnostics-meta.json

      - name: Post Diagnostics as Check
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('report.md') ? fs.readFileSync('report.md','utf-8').slice(0,60000) : '⚠️ Diagnostics report missing.';
            const meta = fs.existsSync('diagnostics-meta.json') ? JSON.parse(fs.readFileSync('diagnostics-meta.json','utf-8')) : { totalErrors: 0, totalWarnings: 0, jobs: 0, schemaFailures: 0, schemaPasses: 0, coverage: { covered: 0, missed: 0 } };

            let conclusion = "success";
            if (meta.schemaFailures > 0 || meta.totalErrors > 0) conclusion = "failure";
            else if (meta.totalWarnings > 0) conclusion = "neutral";

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `CI Diagnostics (${context.ref} @ ${context.sha.slice(0,7)})`,
              head_sha: context.sha,
              status: "completed",
              conclusion,
              output: {
                title: "Central CI Diagnostics Report",
                summary
              }
            });