name: CI Diagnostics

on:
  workflow_call:
    secrets:
      LINEAR_API_KEY:
        required: true
      LINEAR_TEAM_ID:
        required: true
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  diagnostics:
    name: Run CI Diagnostics (Central)
    runs-on: ubuntu-latest
    if: always()
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend summaries
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-summaries
          path: ./summaries/frontend

      - name: Download backend summaries
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-summaries
          path: ./summaries/backend

      - name: Download coverage summaries
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-summaries
          path: ./summaries/coverage

      - name: Debug list summaries
        run: |
          echo "📂 Listing summaries directory contents"
          ls -R ./summaries || true

      - name: Aggregate summaries into report
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const dir = "./summaries";
          let report = "## ⚠️ CI Diagnostics Report\n";

          let files = [];
          try {
            const walk = (dirPath) => {
              let results = [];
              const list = fs.readdirSync(dirPath);
              list.forEach((file) => {
                const filePath = path.join(dirPath, file);
                const stat = fs.statSync(filePath);
                if (stat && stat.isDirectory()) {
                  results = results.concat(walk(filePath));
                } else if (file.toLowerCase().endsWith("-report.json")) {
                  results.push(filePath);
                }
              });
              return results;
            };

            files = walk(dir);
          } catch (e) {
            report += "\n⚠️ No summaries directory found.";
          }

          console.log("📂 Found report files:", files);

          const requiredReports = [
            "playwright-e2e-report.json",
            "eslint-report.json",
            "prettier-report.json",
            "tsc-report.json",
            "jest-report.json"
          ];

          requiredReports.forEach(r => {
            const match = files.find(f => f.toLowerCase().endsWith(r));
            if (!match) {
              console.warn(`⚠️ Missing ${r} in collected reports`);
              report += `\n⚠️ Missing ${r} — dummy injected.`;
              const dummy = { workflow: "frontend-checks", job: r.replace(".json",""), status: "neutral", errors: [], warnings: [], notices: [{ message: `${r} missing from diagnostics aggregation — dummy injected` }] };
              const outPath = `./summaries/${r}`;
              fs.writeFileSync(outPath, JSON.stringify(dummy, null, 2));
              files.push(outPath);
            } else {
              const size = fs.statSync(match).size;
              if (size < 200) {
                console.warn(`⚠️ ${r} exists but looks suspiciously small (${size} bytes)`);
                report += `\n⚠️ ${r} exists but may be dummy (${size} bytes).`;
              }
            }
          });

          let totalErrors = 0, totalWarnings = 0;

          if (!files.length) {
            report += "\n⚠️ No summary reports found (some jobs may have been skipped).";
          } else {
            report += "\n### 📊 Summary Table\n";
            report += "| Workflow/Job | Errors | Warnings |\n";
            report += "|--------------|--------|----------|\n";

            for (const file of files) {
              const raw = JSON.parse(fs.readFileSync(file, "utf-8"));
              totalErrors += raw.errors.length;
              totalWarnings += raw.warnings.length;

              report += `| ${raw.workflow}/${raw.job} | ${raw.errors.length} | ${raw.warnings.length} |\n`;
            }

            report += "\n---\n";

            for (const file of files) {
              const raw = JSON.parse(fs.readFileSync(file, "utf-8"));
              report += `\n### ${raw.workflow} / ${raw.job}\n`;
              report += `Status: ${raw.status}\n`;
              if (raw.errors.length) {
                report += "\n❌ Errors:\n";
                raw.errors.forEach(e => {
                  report += `- ${e.file||"?"}:${e.line||"?"} ${e.message} (rule: ${e.rule||"?"}) [${e.severity||"error"}]\n`;
                  if (e.suggestion) report += `  💡 Suggestion: ${e.suggestion}\n`;
                  if (e.details) report += `  🔍 Details: ${e.details}\n`;
                });
              }
              if (raw.warnings.length) {
                report += "\n⚠️ Warnings:\n";
                raw.warnings.forEach(w => {
                  report += `- ${w.file||"?"}:${w.line||"?"} ${w.message} (rule: ${w.rule||"?"}) [${w.severity||"warning"}]\n`;
                  if (w.suggestion) report += `  💡 Suggestion: ${w.suggestion}\n`;
                  if (w.details) report += `  🔍 Details: ${w.details}\n`;
                });
              }
              if (raw.notices.length) {
                report += "\nℹ️ Notices:\n";
                raw.notices.forEach(n => {
                  report += `- ${n.file||"?"}:${n.line||"?"} ${n.message}\n`;
                });
              }
            }
          }

          fs.writeFileSync("report.md", report);
          fs.writeFileSync("diagnostics-meta.json", JSON.stringify({ totalErrors, totalWarnings }, null, 2));
          console.log(report);
          '