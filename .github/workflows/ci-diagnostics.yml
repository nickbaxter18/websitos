name: CI Diagnostics

on:
  workflow_call:
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  run-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend summaries
        uses: actions/download-artifact@v4
        with:
          name: frontend-summaries
          path: ./summaries/frontend

      - name: Download backend summaries
        uses: actions/download-artifact@v4
        with:
          name: backend-summaries
          path: ./summaries/backend

      - name: Download coverage summaries
        uses: actions/download-artifact@v4
        with:
          name: coverage-summaries
          path: ./summaries/coverage

      - name: Aggregate Diagnostics
        run: |
          mkdir -p summaries

          node -e '
          const fs = require("fs");
          const path = require("path");

          const baseDir = "summaries";
          const allReports = [];
          const manifests = [];

          function loadFiles(dir) {
            if (!fs.existsSync(dir)) return;
            for (const file of fs.readdirSync(dir)) {
              const full = path.join(dir, file);
              if (fs.statSync(full).isDirectory()) {
                loadFiles(full);
              } else if (file.endsWith("-report.json")) {
                try {
                  const data = JSON.parse(fs.readFileSync(full, "utf-8"));
                  data.__file = full;
                  allReports.push(data);
                } catch (e) {
                  allReports.push({ workflow: "diagnostics", job: file, status: "failure", errors: [{ message: `Failed to parse: ${e.message}` }], warnings: [], notices: [] });
                }
              } else if (file === "artifact-manifest.txt") {
                manifests.push({ path: full, content: fs.readFileSync(full, "utf-8") });
              }
            }
          }

          loadFiles(baseDir);

          let totalErrors = 0;
          let totalWarnings = 0;

          let summaryTable = "### 📊 Summary Table\n\n| Workflow/Job | Errors | Warnings | Status |\n|--------------|--------|----------|--------|\n";
          let metadataTable = "\n### 🛠 Tool Metadata\n\n| Job | Exit Code | File Size | SHA256 | Timestamp |\n|-----|-----------|-----------|--------|-----------|\n";

          for (const r of allReports) {
            totalErrors += r.errors?.length || 0;
            totalWarnings += r.warnings?.length || 0;

            summaryTable += `| ${r.workflow}/${r.job} | ${r.errors?.length || 0} | ${r.warnings?.length || 0} | ${r.status || "?"} |\n`;

            const exitNotice = (r.notices || []).find(n => n.message.includes("exit code"));
            const sizeNotice = (r.notices || []).find(n => n.message.includes("Input size"));
            const checksumNotice = (r.notices || []).find(n => n.message.includes("sha256"));
            const timestampNotice = (r.notices || []).find(n => n.message.includes("Timestamp"));

            metadataTable += `| ${r.workflow}/${r.job} | ${exitNotice ? exitNotice.message.split(": ")[1] : "?"} | ${sizeNotice ? sizeNotice.message.split(",")[0].split(": ")[1] : "?"} | ${checksumNotice ? checksumNotice.message.split("sha256: ")[1] : "?"} | ${timestampNotice ? timestampNotice.message.split(": ")[1] : "?"} |\n`;
          }

          let manifestSection = "\n### 📦 Artifact Manifests\n";
          if (manifests.length > 0) {
            manifests.forEach(m => {
              manifestSection += `\n**${m.path}:**\n\n\`\`\`\n${m.content}\n\`\`\`\n`;
            });
          } else {
            manifestSection += "\n_No artifact manifests found._\n";
          }

          let conclusion = "success";
          if (totalErrors > 0) conclusion = "failure";
          else if (totalWarnings > 0) conclusion = "neutral";

          const reportOut = `## ⚠️ CI Diagnostics Report\n\n${summaryTable}\n${metadataTable}\n${manifestSection}`;
          fs.writeFileSync("report.md", reportOut);
          fs.writeFileSync("diagnostics-meta.json", JSON.stringify({ totalErrors, totalWarnings }, null, 2));
          '

      - name: Upload Diagnostics Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-report
          path: |
            report.md
            diagnostics-meta.json

      - name: Post Diagnostics as Check
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('report.md') ? fs.readFileSync('report.md','utf-8').slice(0,60000) : '⚠️ Diagnostics report missing.';
            const meta = fs.existsSync('diagnostics-meta.json') ? JSON.parse(fs.readFileSync('diagnostics-meta.json','utf-8')) : { totalErrors: 0, totalWarnings: 0 };

            let conclusion = "success";
            if (meta.totalErrors > 0) conclusion = "failure";
            else if (meta.totalWarnings > 0) conclusion = "neutral";

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "CI Diagnostics (Central)",
              head_sha: context.payload.workflow_run.head_sha,
              status: "completed",
              conclusion,
              output: {
                title: "Central CI Diagnostics Report",
                summary
              }
            });