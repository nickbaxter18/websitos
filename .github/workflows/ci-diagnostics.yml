name: CI Diagnostics

on:
  workflow_call: {}

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  run-diagnostics:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend summaries
        uses: actions/download-artifact@v4
        with:
          name: frontend-summaries
          path: ./summaries/frontend

      - name: Download backend summaries
        uses: actions/download-artifact@v4
        with:
          name: backend-summaries
          path: ./summaries/backend

      - name: Download coverage summaries
        uses: actions/download-artifact@v4
        with:
          name: coverage-summaries
          path: ./summaries/coverage

      - name: Check for missing artifacts
        run: |
          mkdir -p summaries
          for dir in frontend backend coverage; do
            if [ ! -d "summaries/$dir" ]; then
              echo "⚠️ $dir-summaries missing" | tee -a summaries/missing-artifacts.log
            fi
          done

      - name: Capture environment info
        run: |
          echo "📋 Capturing environment info"
          node -v > summaries/env-info.txt || true
          python3 --version >> summaries/env-info.txt || true
          uname -a >> summaries/env-info.txt || true

      - name: Debug summaries before aggregation
        run: |
          echo "📂 Available summaries before aggregation:"
          ls -lhR summaries || true
          echo "📑 File hashes before aggregation:"
          find summaries -type f -exec sha256sum {} \; || true

      - name: Aggregate Diagnostics
        run: |
          START_TIME=$(date +%s)
          mkdir -p summaries
          node -e '
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const baseDir = "summaries";
          const allReports = [];
          const manifests = [];
          let fileCount = 0;

          function loadFiles(dir) {
            if (!fs.existsSync(dir)) return;
            for (const file of fs.readdirSync(dir)) {
              const full = path.join(dir, file);
              if (fs.statSync(full).isDirectory()) {
                loadFiles(full);
              } else {
                fileCount++;
                if (/\.(json|log|txt|xml)$/i.test(file)) {
                  try {
                    const content = fs.readFileSync(full, "utf-8");
                    let parsed;
                    try {
                      parsed = JSON.parse(content);
                    } catch {
                      parsed = { raw: content.slice(0,500), warnings: [{ message: "Non-JSON file parsed as raw" }] };
                    }
                    parsed.__file = full;
                    if (fs.existsSync(path.join(path.dirname(full), "exit-code.txt"))) {
                      parsed.exit_code = fs.readFileSync(path.join(path.dirname(full), "exit-code.txt"), "utf-8").trim();
                    }
                    if (fs.existsSync(path.join(path.dirname(full), "timestamp.txt"))) {
                      parsed.timestamp = fs.readFileSync(path.join(path.dirname(full), "timestamp.txt"), "utf-8").trim();
                    }
                    parsed.sha256 = crypto.createHash("sha256").update(content).digest("hex");
                    allReports.push(parsed);
                  } catch (e) {
                    allReports.push({ file: full, status: "failure", errors: [{ message: `Failed to read: ${e.message}` }] });
                  }
                } else if (file.endsWith("artifact-manifest.txt")) {
                  manifests.push({ path: full, content: fs.readFileSync(full, "utf-8") });
                }
              }
            }
          }

          loadFiles(baseDir);

          if (allReports.length === 0) {
            allReports.push({ workflow: "diagnostics", job: "aggregate", status: "failure", errors: [{ message: "No reports found" }], warnings: [], notices: [] });
          }

          let totalErrors = 0, totalWarnings = 0;
          allReports.forEach(r => {
            totalErrors += r.errors?.length || 0;
            totalWarnings += r.warnings?.length || 0;
          });

          const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          let summaryTable = "### 📊 Summary Table\\n\\n| File | Errors | Warnings | Status | Exit | SHA256 | Timestamp |\\n|------|--------|----------|--------|------|--------|-----------|\\n";

          for (const r of allReports) {
            summaryTable += `| ${r.__file || r.file || "?"} | ${r.errors?.length || 0} | ${r.warnings?.length || 0} | ${r.status || "?"} | ${r.exit_code || "?"} | ${r.sha256 || "?"} | ${r.timestamp || "?"} |\\n`;
          }

          let manifestSection = "\\n### 📦 Artifact Manifests\\n";
          if (manifests.length > 0) {
            manifests.forEach(m => {
              manifestSection += `\\n**${m.path}:**\\n\\n\\u0060\\u0060\\u0060\\n${m.content}\\n\\u0060\\u0060\\u0060\\n`;
            });
          } else {
            manifestSection += "\\n_No artifact manifests found._\\n";
          }

          const reportOut = `## ⚠️ CI Diagnostics Report\\n\\n${summaryTable}\\nTotal files scanned: ${fileCount}\\n\\n🔗 [View workflow run](${runUrl})${manifestSection}`;
          fs.writeFileSync("report.md", reportOut);
          fs.writeFileSync("diagnostics-meta.json", JSON.stringify({ totalErrors, totalWarnings, reports: allReports.length, files: fileCount }, null, 2));
          '
          END_TIME=$(date +%s)
          echo "Duration: $((END_TIME-START_TIME))s" > summaries/duration.txt

      - name: Debug report after aggregation
        run: |
          echo "📄 Report generated (first 40 lines):"
          head -n 40 report.md || true
          echo "📄 Report generated (last 20 lines):"
          tail -n 20 report.md || true
          echo "📊 Diagnostics Meta:"
          cat diagnostics-meta.json || true

      - name: Upload Diagnostics Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-report
          path: |
            report.md
            diagnostics-meta.json
            summaries/env-info.txt
            summaries/missing-artifacts.log
            summaries/duration.txt

      - name: Upload Raw Diagnostics Dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-raw-dump
          path: summaries/
          retention-days: 2

      - name: Post Diagnostics as Check
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('report.md') ? fs.readFileSync('report.md','utf-8').slice(0,60000) : '⚠️ Diagnostics report missing.';
            const meta = fs.existsSync('diagnostics-meta.json') ? JSON.parse(fs.readFileSync('diagnostics-meta.json','utf-8')) : { totalErrors: 0, totalWarnings: 0, reports: 0, files: 0 };
            let conclusion = "success";
            if (meta.reports === 0) conclusion = "neutral";
            else if (meta.totalErrors > 0) conclusion = "failure";
            else if (meta.totalWarnings > 0) conclusion = "neutral";
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `CI Diagnostics (${context.ref} @ ${context.sha.slice(0,7)})`,
              head_sha: context.sha,
              status: "completed",
              conclusion,
              output: {
                title: "Central CI Diagnostics Report",
                summary
              }
            });