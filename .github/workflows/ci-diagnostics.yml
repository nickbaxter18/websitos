name: CI Diagnostics

on:
  workflow_call: {}

permissions:
  checks: write
  contents: read
  actions: read

jobs:
  run-diagnostics:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug Diagnostics Environment
        run: |
          echo "=== DIAGNOSTICS JOB ENV DEBUG ==="
          node -v || true
          npm -v || true
          pnpm -v || true
          python3 --version || true
          pip3 list || true
          echo "Environment variables:" 
          printenv | sort || true
          echo "Workspace files before summaries:" 
          ls -R || true

      - name: Download frontend summaries
        uses: actions/download-artifact@v4
        with:
          name: frontend-summaries
          path: ./summaries/frontend

      - name: Download backend summaries
        uses: actions/download-artifact@v4
        with:
          name: backend-summaries
          path: ./summaries/backend

      - name: Download coverage summaries
        uses: actions/download-artifact@v4
        with:
          name: coverage-summaries
          path: ./summaries/coverage

      - name: Debug Summaries After Download
        run: |
          echo "=== SUMMARIES DEBUG ==="
          ls -lhR summaries || true
          echo "File hashes in summaries:" 
          find summaries -type f -exec sha256sum {} \; || true

      - name: Aggregate Diagnostics
        run: |
          echo "Running aggregation at $(date -u)"
          node -e '
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const baseDir = "summaries";
          const allReports = [];
          let fileCount = 0;

          function loadFiles(dir) {
            if (!fs.existsSync(dir)) return;
            for (const file of fs.readdirSync(dir)) {
              const full = path.join(dir, file);
              if (fs.statSync(full).isDirectory()) {
                loadFiles(full);
              } else {
                fileCount++;
                let parsed;
                try {
                  const content = fs.readFileSync(full, "utf-8");
                  try { parsed = JSON.parse(content); } 
                  catch { parsed = { raw: content.slice(0,300) }; }
                  parsed.__file = full;
                  parsed.sha256 = crypto.createHash("sha256").update(content).digest("hex");
                } catch (e) {
                  parsed = { file: full, status: "failure", errors: [{ message: e.message }] };
                }
                allReports.push(parsed);
              }
            }
          }

          loadFiles(baseDir);

          if (allReports.length === 0) {
            allReports.push({ workflow: "diagnostics", job: "aggregate", status: "failure", errors: [{ message: "No reports found" }] });
          }

          const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          let totalErrors = 0;
          let totalWarnings = 0;

          let summaryTable = "### 📊 Summary Table\n\n| Workflow/Job | Errors | Warnings | Status | SHA256 | File |\n|--------------|--------|----------|--------|--------|------|\n";

          for (const r of allReports) {
            const wf = r.workflow || "?";
            const job = r.job || "?";
            const file = r.__file || r.file || "?";
            const errors = r.errors?.length || 0;
            const warnings = r.warnings?.length || 0;
            const status = r.status || "?";
            const sha = r.sha256 || "?";

            totalErrors += errors;
            totalWarnings += warnings;

            summaryTable += `| ${wf}/${job} | ${errors} | ${warnings} | ${status} | ${sha} | ${file} |\n`;
          }

          let conclusion = "success";
          if (totalErrors > 0) conclusion = "failure";
          else if (totalWarnings > 0) conclusion = "neutral";

          const totals = `\n### Totals\n- Reports: ${allReports.length}\n- Files: ${fileCount}\n- Errors: ${totalErrors}\n- Warnings: ${totalWarnings}\n`;

          const reportOut = `## ⚠️ CI Diagnostics Report\n\n${summaryTable}\n${totals}\n\n🔗 [View workflow run](${runUrl})`;
          fs.writeFileSync("report.md", reportOut);
          fs.writeFileSync("diagnostics-meta.json", JSON.stringify({ reports: allReports.length, files: fileCount, totalErrors, totalWarnings }, null, 2));
          '

      - name: Debug Report After Aggregation
        run: |
          echo "=== REPORT DEBUG ==="
          echo "First 30 lines:" 
          head -n 30 report.md || true
          echo "Last 20 lines:" 
          tail -n 20 report.md || true
          echo "Diagnostics Meta:" 
          cat diagnostics-meta.json || true

      - name: Upload Diagnostics Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-report
          path: |
            report.md
            diagnostics-meta.json
          retention-days: 7

      - name: Upload Raw Summaries Dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-raw-dump
          path: summaries/
          retention-days: 7

      - name: Post Diagnostics as Check
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('report.md') ? fs.readFileSync('report.md','utf-8').slice(0,60000) : '⚠️ Diagnostics report missing.';
            const meta = fs.existsSync('diagnostics-meta.json') ? JSON.parse(fs.readFileSync('diagnostics-meta.json','utf-8')) : { reports: 0, files: 0, totalErrors: 0, totalWarnings: 0 };

            let conclusion = "success";
            if (meta.totalErrors > 0) conclusion = "failure";
            else if (meta.totalWarnings > 0) conclusion = "neutral";
            else if (meta.reports === 0) conclusion = "neutral";

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `CI Diagnostics (${context.ref} @ ${context.sha.slice(0,7)})`,
              head_sha: context.sha,
              status: "completed",
              conclusion,
              output: {
                title: "Central CI Diagnostics Report",
                summary
              }
            });